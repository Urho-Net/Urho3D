name: Build Urho3D Libraries


on:
  push:
    branches: [ dotnet-10.x ]
    paths:
      - 'Source/**'
      - 'script/**'
      - 'CMakeLists.txt'
      - 'DotNet/libs/**'
      - '.github/workflows/build-urho3d-libraries.yml'
  pull_request:
    branches: [ dotnet-10.x ]
    paths:
      - 'Source/**'
      - 'script/**'
      - 'CMakeLists.txt'
      - 'DotNet/libs/**'
  workflow_dispatch:  # Allow manual triggering

# Required permissions
permissions:
  contents: write

jobs:
  # Check if source files have changed
  check-changes:
    name: Check for source changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_sources.outputs.changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Check for source changes
      id: check_sources
      run: |
        SHOULD_BUILD=false
        
        # Always build on manual dispatch
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🔨 Manual workflow dispatch - FORCING BUILD"
          SHOULD_BUILD=true
        # Check if this is the first commit
        elif ! git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "First commit - building all libraries"
          SHOULD_BUILD=true
        else
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          
          echo "Changed files in this commit:"
          echo "$CHANGED_FILES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Check if workflow file changed - always build
          if echo "$CHANGED_FILES" | grep -q ".github/workflows/build-urho3d-libraries.yml"; then
            echo "✅ Workflow file changed - FORCING BUILD to test changes"
            SHOULD_BUILD=true
          else
            # Check if Source directory or build scripts changed
            while IFS= read -r file; do
              if [[ "$file" == Source/* ]] || \
                 [[ "$file" == script/* ]] || \
                 [[ "$file" == DotNet/libs/* ]] || \
                 [[ "$file" == CMakeLists.txt ]]; then
                echo "✅ Found source change: $file"
                SHOULD_BUILD=true
                break
              fi
            done <<< "$CHANGED_FILES"
          fi
        fi
        
        if [ "$SHOULD_BUILD" = true ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "✅ Will build libraries"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "⏭️  No source changes - skipping build"
        fi

  build-macos-arm64:
    name: Build macOS arm64 Libraries
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake
    
    - name: Build macOS arm64 libraries
      run: |
        chmod +x script/build_xcode_dotnet_metal_dylib_arm64.sh
        chmod +x script/cmake_xcode_dotnet_metal_dylib.sh
        ./script/build_xcode_dotnet_metal_dylib_arm64.sh
    
    - name: Verify arm64 libraries
      run: |
        MISSING_FILES=0
        
        if [ -f "DotNet/libs/macos/arm64/Release/libUrho3D.dylib" ]; then
          file DotNet/libs/macos/arm64/Release/libUrho3D.dylib
          otool -L DotNet/libs/macos/arm64/Release/libUrho3D.dylib
          echo "✓ arm64 Release library verified"
        else
          echo "❌ arm64 Release library MISSING"
          MISSING_FILES=$((MISSING_FILES + 1))
        fi
        
        if [ -f "DotNet/libs/macos/arm64/Debug/libUrho3D.dylib" ]; then
          file DotNet/libs/macos/arm64/Debug/libUrho3D.dylib
          otool -L DotNet/libs/macos/arm64/Debug/libUrho3D.dylib
          echo "✓ arm64 Debug library verified"
        else
          echo "⚠️  arm64 Debug library MISSING"
        fi
        
        if [ $MISSING_FILES -gt 0 ]; then
          echo ""
          echo "ERROR: $MISSING_FILES required arm64 Release libraries are missing!"
          exit 1
        fi
    
    - name: Upload macOS arm64 Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-arm64-release-libraries
        path: DotNet/libs/macos/arm64/Release/libUrho3D.dylib
        retention-days: 30
    
    - name: Upload macOS arm64 Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-arm64-debug-libraries
        path: DotNet/libs/macos/arm64/Debug/libUrho3D.dylib
        if-no-files-found: warn
        retention-days: 30

  build-macos-x86_64:
    name: Build macOS x86_64 Libraries
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake
    
    - name: Build macOS x86_64 libraries
      run: |
        chmod +x script/build_xcode_dotnet_metal_dylib_x86_64.sh
        chmod +x script/cmake_xcode_dotnet_metal_dylib.sh
        ./script/build_xcode_dotnet_metal_dylib_x86_64.sh
    
    - name: Verify x86_64 libraries
      run: |
        MISSING_FILES=0
        
        if [ -f "DotNet/libs/macos/x86_64/Release/libUrho3D.dylib" ]; then
          file DotNet/libs/macos/x86_64/Release/libUrho3D.dylib
          otool -L DotNet/libs/macos/x86_64/Release/libUrho3D.dylib
          echo "✓ x86_64 Release library verified"
        else
          echo "❌ x86_64 Release library MISSING"
          MISSING_FILES=$((MISSING_FILES + 1))
        fi
        
        if [ -f "DotNet/libs/macos/x86_64/Debug/libUrho3D.dylib" ]; then
          file DotNet/libs/macos/x86_64/Debug/libUrho3D.dylib
          otool -L DotNet/libs/macos/x86_64/Debug/libUrho3D.dylib
          echo "✓ x86_64 Debug library verified"
        else
          echo "⚠️  x86_64 Debug library MISSING"
        fi
        
        if [ $MISSING_FILES -gt 0 ]; then
          echo ""
          echo "ERROR: $MISSING_FILES required x86_64 Release libraries are missing!"
          exit 1
        fi
    
    - name: Upload macOS x86_64 Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-x86_64-release-libraries
        path: DotNet/libs/macos/x86_64/Release/libUrho3D.dylib
        retention-days: 30
    
    - name: Upload macOS x86_64 Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-x86_64-debug-libraries
        path: DotNet/libs/macos/x86_64/Debug/libUrho3D.dylib
        if-no-files-found: warn
        retention-days: 30

  build-macos-editor-arm64:
    name: Build macOS Editor arm64 Libraries
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake
    
    - name: Build macOS Editor arm64 libraries
      run: |
        chmod +x script/build_xcode_dotnet_editor_metal_dylib_arm64.sh
        chmod +x script/cmake_xcode_dotnet_editor_metal_dylib.sh
        ./script/build_xcode_dotnet_editor_metal_dylib_arm64.sh
    
    - name: Verify Editor arm64 libraries
      run: |
        MISSING_FILES=0
        
        if [ -f "DotNet/libs/editor/macos/arm64/Release/libUrho3D.dylib" ]; then
          file DotNet/libs/editor/macos/arm64/Release/libUrho3D.dylib
          otool -L DotNet/libs/editor/macos/arm64/Release/libUrho3D.dylib
          echo "✓ Editor arm64 Release library verified"
        else
          echo "❌ Editor arm64 Release library MISSING"
          MISSING_FILES=$((MISSING_FILES + 1))
        fi
        
        if [ -f "DotNet/libs/editor/macos/arm64/Debug/libUrho3D.dylib" ]; then
          file DotNet/libs/editor/macos/arm64/Debug/libUrho3D.dylib
          otool -L DotNet/libs/editor/macos/arm64/Debug/libUrho3D.dylib
          echo "✓ Editor arm64 Debug library verified"
        else
          echo "⚠️  Editor arm64 Debug library MISSING"
        fi
        
        if [ $MISSING_FILES -gt 0 ]; then
          echo ""
          echo "ERROR: $MISSING_FILES required Editor arm64 Release libraries are missing!"
          exit 1
        fi
    
    - name: Upload macOS Editor arm64 Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-editor-arm64-release-libraries
        path: DotNet/libs/editor/macos/arm64/Release/libUrho3D.dylib
        retention-days: 30
    
    - name: Upload macOS Editor arm64 Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-editor-arm64-debug-libraries
        path: DotNet/libs/editor/macos/arm64/Debug/libUrho3D.dylib
        if-no-files-found: warn
        retention-days: 30

  build-macos-editor-x86_64:
    name: Build macOS Editor x86_64 Libraries
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake
    
    - name: Build macOS Editor x86_64 libraries
      run: |
        chmod +x script/build_xcode_dotnet_editor_metal_dylib_x86_64.sh
        chmod +x script/cmake_xcode_dotnet_editor_metal_dylib.sh
        ./script/build_xcode_dotnet_editor_metal_dylib_x86_64.sh
    
    - name: Verify Editor x86_64 libraries
      run: |
        MISSING_FILES=0
        
        if [ -f "DotNet/libs/editor/macos/x86_64/Release/libUrho3D.dylib" ]; then
          file DotNet/libs/editor/macos/x86_64/Release/libUrho3D.dylib
          otool -L DotNet/libs/editor/macos/x86_64/Release/libUrho3D.dylib
          echo "✓ Editor x86_64 Release library verified"
        else
          echo "❌ Editor x86_64 Release library MISSING"
          MISSING_FILES=$((MISSING_FILES + 1))
        fi
        
        if [ -f "DotNet/libs/editor/macos/x86_64/Debug/libUrho3D.dylib" ]; then
          file DotNet/libs/editor/macos/x86_64/Debug/libUrho3D.dylib
          otool -L DotNet/libs/editor/macos/x86_64/Debug/libUrho3D.dylib
          echo "✓ Editor x86_64 Debug library verified"
        else
          echo "⚠️  Editor x86_64 Debug library MISSING"
        fi
        
        if [ $MISSING_FILES -gt 0 ]; then
          echo ""
          echo "ERROR: $MISSING_FILES required Editor x86_64 Release libraries are missing!"
          exit 1
        fi
    
    - name: Upload macOS Editor x86_64 Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-editor-x86_64-release-libraries
        path: DotNet/libs/editor/macos/x86_64/Release/libUrho3D.dylib
        retention-days: 30
    
    - name: Upload macOS Editor x86_64 Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-macos-editor-x86_64-debug-libraries
        path: DotNet/libs/editor/macos/x86_64/Debug/libUrho3D.dylib
        if-no-files-found: warn
        retention-days: 30

  build-linux:
    name: Build Linux Libraries
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libx11-dev libxrandr-dev \
          libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
          libasound2-dev libudev-dev
    
    - name: Build Linux libraries
      run: |
        chmod +x script/build_linux_dotnet_so.sh
        chmod +x script/cmake_linux_dotnet_so.sh
        
        # Configure URHONET_HOME
        mkdir -p ~/.urhonet_config
        echo "$(pwd)" > ~/.urhonet_config/urhonethome
        
        ./script/build_linux_dotnet_so.sh
    
    - name: Verify library
      run: |
        ARCH=$(uname -m)
        if [ -f "DotNet/libs/linux/${ARCH}/Release/libUrho3D.so" ]; then
          file DotNet/libs/linux/${ARCH}/Release/libUrho3D.so
          ldd DotNet/libs/linux/${ARCH}/Release/libUrho3D.so
          echo "✓ Linux ${ARCH} library verified"
        fi
    
    - name: Upload Linux libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-linux-libraries
        path: DotNet/libs/linux/x86_64/Release/libUrho3D.so
        retention-days: 30
    
    - name: Upload Linux Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-linux-debug-libraries
        path: DotNet/libs/linux/x86_64/Debug/libUrho3D.so
        if-no-files-found: warn
        retention-days: 30

  build-windows:
    name: Build Windows Libraries
    runs-on: windows-2019
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Windows libraries
      run: |
        .\script\build_vs2019_dotnet_dll.bat
    
    - name: Verify library
      run: |
        if (Test-Path "DotNet\libs\windows\Release\Urho3D.dll") {
          Write-Output "✓ Windows library built successfully"
          Get-Item "DotNet\libs\windows\Release\Urho3D.dll" | Select-Object Name,Length,LastWriteTime
        } else {
          Write-Error "Windows library not found"
          exit 1
        }
    
    - name: Upload Windows libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-windows-libraries
        path: DotNet/libs/windows/Release/Urho3D.dll
        retention-days: 30
    
    - name: Upload Windows Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-windows-debug-libraries
        path: DotNet/libs/windows/Debug/Urho3D.dll
        if-no-files-found: warn
        retention-days: 30

  build-windows-editor:
    name: Build Windows Editor Libraries
    runs-on: windows-2019
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Windows Editor libraries
      run: |
        .\script\build_vs2019_dotnet_editor_dll.bat
    
    - name: Verify Editor library
      run: |
        if (Test-Path "DotNet\libs\editor\windows\Release\Urho3D.dll") {
          Write-Output "✓ Windows Editor library built successfully"
          Get-Item "DotNet\libs\editor\windows\Release\Urho3D.dll" | Select-Object Name,Length,LastWriteTime
        } else {
          Write-Error "Windows Editor library not found"
          exit 1
        }
    
    - name: Upload Windows Editor Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-windows-editor-release-libraries
        path: DotNet/libs/editor/windows/Release/Urho3D.dll
        retention-days: 30
    
    - name: Upload Windows Editor Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-windows-editor-debug-libraries
        path: DotNet/libs/editor/windows/Debug/Urho3D.dll
        if-no-files-found: warn
        retention-days: 30

  build-linux-editor:
    name: Build Linux Editor Libraries
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libx11-dev libxrandr-dev \
          libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
          libasound2-dev libudev-dev
    
    - name: Build Linux Editor libraries
      run: |
        chmod +x script/build_linux_dotnet_editor_so.sh
        chmod +x script/cmake_linux_dotnet_editor_so.sh
        
        # Configure URHONET_HOME
        mkdir -p ~/.urhonet_config
        echo "$(pwd)" > ~/.urhonet_config/urhonethome
        
        ./script/build_linux_dotnet_editor_so.sh
    
    - name: Verify Editor library
      run: |
        ARCH=$(uname -m)
        if [ -f "DotNet/libs/editor/linux/${ARCH}/Release/libUrho3D.so" ]; then
          file DotNet/libs/editor/linux/${ARCH}/Release/libUrho3D.so
          ldd DotNet/libs/editor/linux/${ARCH}/Release/libUrho3D.so
          echo "✓ Linux ${ARCH} Editor library verified"
        fi
    
    - name: Upload Linux Editor Release libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-linux-editor-release-libraries
        path: DotNet/libs/editor/linux/x86_64/Release/libUrho3D.so
        retention-days: 30
    
    - name: Upload Linux Editor Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-linux-editor-debug-libraries
        path: DotNet/libs/editor/linux/x86_64/Debug/libUrho3D.so
        if-no-files-found: warn
        retention-days: 30

  build-android:
    name: Build Android Libraries
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android NDK
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
    
    - name: Build Android libraries
      run: |
        chmod +x script/build_android_dotnet_libs.sh
        ./script/build_android_dotnet_libs.sh
    
    - name: Upload Android libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-android-libraries
        path: |
          DotNet/libs/android/Release/armeabi-v7a/*.so
          DotNet/libs/android/Release/x86/*.so
          DotNet/libs/android/Release/arm64-v8a/*.so
          DotNet/libs/android/Release/x86_64/*.so
        retention-days: 30

  build-ios:
    name: Build iOS Libraries
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake
    
    - name: Build iOS libraries
      run: |
        chmod +x script/build_ios_dotnet_libs.sh
        chmod +x script/cmake_ios_dotnet_lib_metal_shared.sh
        ./script/build_ios_dotnet_libs.sh
    
    - name: Upload iOS libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-ios-libraries
        path: |
          DotNet/libs/iphone/Release-iphoneos/Urho3D.framework
          DotNet/libs/iphone/Debug-iphoneos/Urho3D.framework
        retention-days: 30

  build-wasm:
    name: Build WebAssembly Libraries
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.34'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake python3 git
    
    - name: Build WebAssembly libraries
      run: |
        chmod +x script/cmake_emscripten_dotnet_lib.sh
        chmod +x script/build_emscripten_dotnet_lib.sh
        chmod +x script/cmake_generic.sh
        
        # Skip Emscripten installation since setup-emsdk already installed it
        export SKIP_EMSDK_INSTALL=1
        
        ./script/build_emscripten_dotnet_lib.sh
    
    - name: Verify WASM library is 32-bit
      run: |
        if [ -f "DotNet/libs/wasm/Release/Urho3D.a" ]; then
          echo "Checking WebAssembly format..."
          file DotNet/libs/wasm/Release/Urho3D.a
          ls -lh DotNet/libs/wasm/Release/Urho3D.a
          echo "✓ WebAssembly library built successfully"
        else
          echo "❌ WebAssembly library not found at DotNet/libs/wasm/Release/Urho3D.a"
          ls -la DotNet/libs/wasm/ || echo "wasm directory not found"
          exit 1
        fi
    
    - name: Upload WebAssembly libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-wasm-libraries
        path: DotNet/libs/wasm/Release/Urho3D.a
        retention-days: 30
    
    - name: Upload WebAssembly Debug libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-wasm-debug-libraries
        path: DotNet/libs/wasm/Debug/Urho3D.a
        if-no-files-found: warn
        retention-days: 30

  # Combine all artifacts into a single bundle
  combine-artifacts:
    name: Combine All Platform Libraries
    runs-on: ubuntu-latest
    needs: [check-changes, build-macos-arm64, build-macos-x86_64, build-macos-editor-arm64, build-macos-editor-x86_64, build-linux, build-windows, build-windows-editor, build-linux-editor, build-android, build-ios, build-wasm]
    if: |
      always() &&
      needs.check-changes.outputs.should_build == 'true' &&
      (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') &&
      (needs.build-macos-x86_64.result == 'success' || needs.build-macos-x86_64.result == 'skipped') &&
      (needs.build-macos-editor-arm64.result == 'success' || needs.build-macos-editor-arm64.result == 'skipped') &&
      (needs.build-macos-editor-x86_64.result == 'success' || needs.build-macos-editor-x86_64.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-windows-editor.result == 'success' || needs.build-windows-editor.result == 'skipped') &&
      (needs.build-linux-editor.result == 'success' || needs.build-linux-editor.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') &&
      (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Combine artifacts into single structure
      run: |
        mkdir -p combined-libs/DotNet/libs
        
        echo "📦 Combining artifacts..."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # Debug: Show what artifacts were downloaded
        echo "Downloaded artifacts:"
        ls -la artifacts/
        
        # macOS arm64 Release
        if [ -d "artifacts/urho3d-macos-arm64-release-libraries" ]; then
          echo "✓ macOS arm64 Release libraries"
          mkdir -p combined-libs/DotNet/libs/macos/arm64/Release
          find artifacts/urho3d-macos-arm64-release-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/macos/arm64/Release/ \; 2>/dev/null || true
        fi
        
        # macOS arm64 Debug
        if [ -d "artifacts/urho3d-macos-arm64-debug-libraries" ]; then
          echo "✓ macOS arm64 Debug libraries"
          mkdir -p combined-libs/DotNet/libs/macos/arm64/Debug
          find artifacts/urho3d-macos-arm64-debug-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/macos/arm64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  macOS arm64 Debug libraries not found"
        fi
        
        # macOS x86_64 Release
        if [ -d "artifacts/urho3d-macos-x86_64-release-libraries" ]; then
          echo "✓ macOS x86_64 Release libraries"
          mkdir -p combined-libs/DotNet/libs/macos/x86_64/Release
          find artifacts/urho3d-macos-x86_64-release-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/macos/x86_64/Release/ \; 2>/dev/null || true
        fi
        
        # macOS x86_64 Debug
        if [ -d "artifacts/urho3d-macos-x86_64-debug-libraries" ]; then
          echo "✓ macOS x86_64 Debug libraries"
          mkdir -p combined-libs/DotNet/libs/macos/x86_64/Debug
          find artifacts/urho3d-macos-x86_64-debug-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/macos/x86_64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  macOS x86_64 Debug libraries not found"
        fi
        
        # Linux
        if [ -d "artifacts/urho3d-linux-libraries" ]; then
          echo "✓ Linux Release libraries"
          mkdir -p combined-libs/DotNet/libs/linux/x86_64/Release
          find artifacts/urho3d-linux-libraries -name "*.so" -exec cp {} combined-libs/DotNet/libs/linux/x86_64/Release/ \; 2>/dev/null || true
        fi
        
        # Linux Debug
        if [ -d "artifacts/urho3d-linux-debug-libraries" ]; then
          echo "✓ Linux Debug libraries"
          mkdir -p combined-libs/DotNet/libs/linux/x86_64/Debug
          find artifacts/urho3d-linux-debug-libraries -name "*.so" -exec cp {} combined-libs/DotNet/libs/linux/x86_64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  Linux Debug libraries not found"
        fi
        
        # Windows
        if [ -d "artifacts/urho3d-windows-libraries" ]; then
          echo "✓ Windows Release libraries"
          mkdir -p combined-libs/DotNet/libs/windows/Release
          find artifacts/urho3d-windows-libraries -name "*.dll" -exec cp {} combined-libs/DotNet/libs/windows/Release/ \; 2>/dev/null || true
        fi
        
        # Windows Debug
        if [ -d "artifacts/urho3d-windows-debug-libraries" ]; then
          echo "✓ Windows Debug libraries"
          mkdir -p combined-libs/DotNet/libs/windows/Debug
          find artifacts/urho3d-windows-debug-libraries -name "*.dll" -exec cp {} combined-libs/DotNet/libs/windows/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  Windows Debug libraries not found"
        fi
        
        # Android (RelWithDebInfo only - NDK doesn't support separate Debug builds)
        if [ -d "artifacts/urho3d-android-libraries" ]; then
          echo "✓ Android Release libraries (RelWithDebInfo)"
          mkdir -p combined-libs/DotNet/libs/android/Release
          if [ -d "artifacts/urho3d-android-libraries/DotNet" ]; then
            cp -r artifacts/urho3d-android-libraries/DotNet/libs/android/* combined-libs/DotNet/libs/android/ 2>/dev/null || true
          else
            cp -r artifacts/urho3d-android-libraries/* combined-libs/DotNet/libs/android/Release/ 2>/dev/null || true
          fi
        fi
        
        # iOS
        if [ -d "artifacts/urho3d-ios-libraries" ]; then
          echo "✓ iOS libraries"
          mkdir -p combined-libs/DotNet/libs/iphone
          # iOS has the full structure with frameworks
          if [ -d "artifacts/urho3d-ios-libraries/DotNet" ]; then
            cp -r artifacts/urho3d-ios-libraries/DotNet/libs/iphone/* combined-libs/DotNet/libs/iphone/ 2>/dev/null || true
          else
            # Fallback: find frameworks and preserve one level of directory structure
            for config_dir in artifacts/urho3d-ios-libraries/*/; do
              if [ -d "$config_dir" ]; then
                config=$(basename "$config_dir")
                # Check if this looks like a config directory (Release-iphoneos, Debug-iphoneos)
                if [[ "$config" == *"iphoneos" ]]; then
                  mkdir -p combined-libs/DotNet/libs/iphone/$config
                  find "$config_dir" -name "*.framework" -maxdepth 1 -exec cp -r {} combined-libs/DotNet/libs/iphone/$config/ \; 2>/dev/null || true
                fi
              fi
            done
            # If no config dirs found, check for frameworks directly
            if [ -z "$(find combined-libs/DotNet/libs/iphone -name "*.framework" 2>/dev/null)" ]; then
              mkdir -p combined-libs/DotNet/libs/iphone/Release-iphoneos
              find artifacts/urho3d-ios-libraries -name "*.framework" -exec cp -r {} combined-libs/DotNet/libs/iphone/Release-iphoneos/ \; 2>/dev/null || true
            fi
          fi
        fi
        
        # WebAssembly
        if [ -d "artifacts/urho3d-wasm-libraries" ]; then
          echo "✓ WebAssembly Release libraries"
          mkdir -p combined-libs/DotNet/libs/wasm/Release
          find artifacts/urho3d-wasm-libraries -name "*.a" -exec cp {} combined-libs/DotNet/libs/wasm/Release/ \; 2>/dev/null || true
        fi
        
        # WebAssembly Debug
        if [ -d "artifacts/urho3d-wasm-debug-libraries" ]; then
          echo "✓ WebAssembly Debug libraries"
          mkdir -p combined-libs/DotNet/libs/wasm/Debug
          find artifacts/urho3d-wasm-debug-libraries -name "*.a" -exec cp {} combined-libs/DotNet/libs/wasm/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  WebAssembly Debug libraries not found"
        fi
        
        # macOS Editor arm64 Release
        if [ -d "artifacts/urho3d-macos-editor-arm64-release-libraries" ]; then
          echo "✓ macOS Editor arm64 Release libraries"
          mkdir -p combined-libs/DotNet/libs/editor/macos/arm64/Release
          find artifacts/urho3d-macos-editor-arm64-release-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/editor/macos/arm64/Release/ \; 2>/dev/null || true
        fi
        
        # macOS Editor arm64 Debug
        if [ -d "artifacts/urho3d-macos-editor-arm64-debug-libraries" ]; then
          echo "✓ macOS Editor arm64 Debug libraries"
          mkdir -p combined-libs/DotNet/libs/editor/macos/arm64/Debug
          find artifacts/urho3d-macos-editor-arm64-debug-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/editor/macos/arm64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  macOS Editor arm64 Debug libraries not found"
        fi
        
        # macOS Editor x86_64 Release
        if [ -d "artifacts/urho3d-macos-editor-x86_64-release-libraries" ]; then
          echo "✓ macOS Editor x86_64 Release libraries"
          mkdir -p combined-libs/DotNet/libs/editor/macos/x86_64/Release
          find artifacts/urho3d-macos-editor-x86_64-release-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/editor/macos/x86_64/Release/ \; 2>/dev/null || true
        fi
        
        # macOS Editor x86_64 Debug
        if [ -d "artifacts/urho3d-macos-editor-x86_64-debug-libraries" ]; then
          echo "✓ macOS Editor x86_64 Debug libraries"
          mkdir -p combined-libs/DotNet/libs/editor/macos/x86_64/Debug
          find artifacts/urho3d-macos-editor-x86_64-debug-libraries -name "*.dylib" -exec cp {} combined-libs/DotNet/libs/editor/macos/x86_64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  macOS Editor x86_64 Debug libraries not found"
        fi
        
        # Windows Editor Release
        if [ -d "artifacts/urho3d-windows-editor-release-libraries" ]; then
          echo "✓ Windows Editor Release libraries"
          mkdir -p combined-libs/DotNet/libs/editor/windows/Release
          find artifacts/urho3d-windows-editor-release-libraries -name "*.dll" -exec cp {} combined-libs/DotNet/libs/editor/windows/Release/ \; 2>/dev/null || true
        fi
        
        # Windows Editor Debug
        if [ -d "artifacts/urho3d-windows-editor-debug-libraries" ]; then
          echo "✓ Windows Editor Debug libraries"
          mkdir -p combined-libs/DotNet/libs/editor/windows/Debug
          find artifacts/urho3d-windows-editor-debug-libraries -name "*.dll" -exec cp {} combined-libs/DotNet/libs/editor/windows/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  Windows Editor Debug libraries not found"
        fi
        
        # Linux Editor Release
        if [ -d "artifacts/urho3d-linux-editor-release-libraries" ]; then
          echo "✓ Linux Editor Release libraries"
          mkdir -p combined-libs/DotNet/libs/editor/linux/x86_64/Release
          find artifacts/urho3d-linux-editor-release-libraries -name "*.so" -exec cp {} combined-libs/DotNet/libs/editor/linux/x86_64/Release/ \; 2>/dev/null || true
        fi
        
        # Linux Editor Debug
        if [ -d "artifacts/urho3d-linux-editor-debug-libraries" ]; then
          echo "✓ Linux Editor Debug libraries"
          mkdir -p combined-libs/DotNet/libs/editor/linux/x86_64/Debug
          find artifacts/urho3d-linux-editor-debug-libraries -name "*.so" -exec cp {} combined-libs/DotNet/libs/editor/linux/x86_64/Debug/ \; 2>/dev/null || true
        else
          echo "⚠️  Linux Editor Debug libraries not found"
        fi
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Combined libraries structure:"
        find combined-libs -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.dll" -o -name "*.a" \) | sort
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "💾 Library sizes:"
        du -sh combined-libs/DotNet/libs/* 2>/dev/null || true
    
    - name: Upload combined libraries
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-all-libraries
        path: combined-libs/**/*
        retention-days: 90
    
    - name: Create release archives
      run: |
        # Create separate bundles for runtime and editor libraries
        mkdir -p runtime-bundle/DotNet/libs
        mkdir -p editor-bundle/DotNet/libs
        
        # Copy runtime libraries (everything except editor)
        if [ -d "combined-libs/DotNet/libs/macos" ]; then
          cp -r combined-libs/DotNet/libs/macos runtime-bundle/DotNet/libs/
        fi
        if [ -d "combined-libs/DotNet/libs/linux" ]; then
          cp -r combined-libs/DotNet/libs/linux runtime-bundle/DotNet/libs/
        fi
        if [ -d "combined-libs/DotNet/libs/windows" ]; then
          cp -r combined-libs/DotNet/libs/windows runtime-bundle/DotNet/libs/
        fi
        if [ -d "all-libraries.zip
          urho3d-editor-all-combined-libs/DotNet/libs/android" ]; then
          cp -r combined-libs/DotNet/libs/android runtime-bundle/DotNet/libs/
        fi
        if [ -d "combined-libs/DotNet/libs/iphone" ]; then
          cp -r combined-libs/DotNet/libs/iphone runtime-bundle/DotNet/libs/
        fi
        if [ -d "combined-libs/DotNet/libs/wasm" ]; then
          cp -r combined-libs/DotNet/libs/wasm runtime-bundle/DotNet/libs/
        fi
        
        # Copy editor libraries
        if [ -d "combined-libs/DotNet/libs/editor" ]; then
          cp -r combined-libs/DotNet/libs/editor editor-bundle/DotNet/libs/
        fi
        
        # Create runtime libraries archive
        cd runtime-bundle
        tar -czf ../urho3d-libraries.tar.gz DotNet/
        cd ..
        zip -r urho3d-all-libraries.zip runtime-bundle/DotNet/
        
        # Create editor libraries archive
        zip -r urho3d-editor-all-libraries.zip editor-bundle/DotNet/
        
        echo "✅ Archives created:"
        ls -lh urho3d-*.zip urho3d-*.tar.gz
    
    - name: Upload release archives
      uses: actions/upload-artifact@v4
      with:
        name: urho3d-libraries-archives
        path: |
          urho3d-libraries.tar.gz
          urho3d-libraries.zip
        retention-days: 90

  # Create GitHub Release with library archives (only on tag push)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: combine-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download archives
      uses: actions/download-artifact@v4
      with:
        name: urho3d-libraries-archives
    
    - name: Extract tag information
      id: tag_info
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "📦 Creating release for tag: $TAG_NAME"
    
    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << 'EOF'
        ## Urho3D Native Libraries
        
        Pre-built native libraries for all platforms.
        
        ### 📦 Included Platforms
        - **macOS**: arm64 (Apple Silicon) + x86_64 (Intel)
        - **Linux**: x86_64
        - **Windows**: x64
        - **Android**: armeabi-v7a, arm64-v8a, x86, x86_64 (NDK 25.1.8937393)
        - **iOS**: Release + Debug frameworks
        - **WebAssembly**: 32-bit wasm (Emscripten 3.1.34)
        
        ### 📥 DownloadsRuntime libraries (Linux/macOS format)
        - `urho3d-all-libraries.zip` - Runtime libraries (all platforms)
        - `urho3d-editor-all-libraries.zip` - Editor libraries (macOS only)
        
        All archives contain
        Both archives contain the same files in `DotNet/libs/` structure.
        
        ### 🔧 Usage
        1. Download and extract the archive
        2. Copy `DotNet/libs/` to your project
        3. Reference the appropriate platform libraries
        
        ---
        Built from commit: ${{ github.sha }}
        EOF
        
        echo "Release notes generated"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          urho3d-all-libraries.zip
          urho3d-editor-all-libraries.tar.gz
          urho3d-libraries.zip
        body_path: release_notes.md
        draft: false
        prerelease: ${{ contains(steps.tag_info.outputs.tag_name, '-') }}
        fail_on_unmatched_files: true
        generate_release_notes: true

